name: Build and Release

permissions:
  contents: write # Required to upload assets to the GitHub Release

on:
  push:
    branches:
      - master
      - main
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: build static SPA
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: btop-web
          path: build

      - name: Package
        if: github.event_name == 'release'
        run: |
          ARCHIVE="btop-web-${VERSION}"
          STAGE="/tmp/stage"
          mkdir -p "$STAGE"
          cp -r build/. "$STAGE/"
          tar -czf "${ARCHIVE}.tar.gz" -C "$STAGE" .
          sha256sum "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"
          ls -lh "${ARCHIVE}.tar.gz"

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$VERSION" btop-web-${VERSION}.tar.gz btop-web-${VERSION}.tar.gz.sha256 --clobber
